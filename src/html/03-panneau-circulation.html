  <aside class="flowpanel" id="flowpanel" hidden>
    <div class="flow-head">
      <div class="row">
        <span class="flow-title">Circulation</span>
        <button class="flow-x" id="flowClose" title="Hide panel">×</button>
      </div>
      <div class="flow-score">
        <span class="num" id="flowNum">–</span>
        <span class="of">/100</span>
        <span class="band" id="flowBand"></span>
      </div>
      <div class="flow-checking" id="flowChecking"></div>
    </div>
    <div class="flow-tv">
      TV screen
      <span class="in"><input id="flowTv" type="number" min="10" max="120" step="1" placeholder="—"><span class="unit">in</span></span>
      <span style="color:var(--faint)">optional</span>
    </div>
    <div class="flow-list" id="flowList"></div>
  </aside>
</div>
