<!-- The two floating panels live in ONE column anchored to the bottom right. Before, each was
     placed at `right:16px;bottom:16px`: opening the room sheet on top of the inspector hid
     Width, Depth and the four action buttons (checked with `elementFromPoint`). Stacked, they
     never overlap, on any screen size. -->
<div class="side-panels" id="sidePanels">
<!-- Elastic spacer: it pushes the panels toward the BOTTOM of the column and collapses to zero
     when they no longer fit (anchoring via `justify-content:flex-end` would overflow off the
     top, out of scrolling's reach; anchoring via `margin-top:auto` on the first child would be
     lost as soon as the inspector is hidden, since `:first-child` ignores `display:none`). -->
<div class="side-spacer" aria-hidden="true"></div>
<div class="inspector" id="inspector" hidden>
  <!-- The name is not edited HERE any more (decision 0013): double-click the object's own label,
       on the plan, to rename it. The swatch is the only thing left in the head: a quiet
       reminder of which catalogue colour is selected. -->
  <div class="insp-head">
    <span class="sw" id="iSw"></span>
  </div>
  <div class="insp-multi" id="iMulti" hidden></div>
  <div class="insp-grid">
    <div class="field">
      <label for="iW">Width</label>
      <div class="in"><input id="iW" type="number" min="10" max="3000" step="1"><span class="unit">cm</span></div>
    </div>
    <div class="field">
      <label for="iH">Depth</label>
      <div class="in"><input id="iH" type="number" min="10" max="3000" step="1"><span class="unit">cm</span></div>
    </div>
  </div>
  <div class="insp-grid" id="iWallRow" hidden style="grid-template-columns:1fr">
    <div class="field">
      <label for="iWallPos">From the corner</label>
      <div class="in"><input id="iWallPos" type="number" min="0" max="3000" step="1"><span class="unit">cm</span></div>
    </div>
  </div>
  <!-- HOW THIS WINDOW OPENS. Visible on a window and nowhere else. "None" is the default and
       covers both fixed AND top-hung (vasistas): both open vertically or not at all, so neither
       one has a floor footprint to draw. -->
  <div class="insp-leaf" id="iLeafRow" hidden>
    <span class="lbl">Opens</span>
    <span class="seg" role="group" aria-label="How this window opens">
      <button class="btn sm" id="iLeaf0" data-leaf="0" title="Fixed, or top-hung (vasistas): opens vertically, no floor footprint">None</button>
      <button class="btn sm" id="iLeaf1" data-leaf="1" title="One casement, hinged on one side">Single</button>
      <button class="btn sm" id="iLeaf2" data-leaf="2" title="Double window: two casements meeting in the middle">Double</button>
    </span>
  </div>
  <!-- VIDEOPROJECTOR. None of this is a distance: these are the numbers from the spec sheet.
       The distance itself reads below the fields, it is DERIVED from the position. -->
  <div class="insp-proj" id="iProjRow" hidden>
    <div class="insp-grid">
      <div class="field">
        <label for="iTr">Throw ratio</label>
        <div class="in"><input id="iTr" type="number" min="0.1" max="10" step="0.01"><span class="unit">:1</span></div>
      </div>
      <div class="field">
        <label for="iDmin">Min. distance</label>
        <div class="in"><input id="iDmin" type="number" min="0" max="2000" step="1"><span class="unit">cm</span></div>
      </div>
    </div>
    <div class="field">
      <label for="iPair">Aimed at</label>
      <select id="iPair"></select>
    </div>
    <!-- MOUNTING PREFILLS, IT DOES NOT STORE. A projector is on a table, on the CEILING, or a
         short throw sitting under its screen: three very different pairs of numbers, and typing
         them from scratch every time is what stops people entering them at all. The buttons write
         `hp` and `off` and nothing else, so those two fields stay the only truth: change one by
         hand afterwards and no button contradicts you. -->
    <div class="insp-leaf">
      <span class="lbl">Mounting</span>
      <span class="seg" role="group" aria-label="Where the projector sits">
        <button class="btn sm" id="iMount0" title="On a table or a shelf, lens roughly at eye level">Table</button>
        <button class="btn sm" id="iMount1" title="Hung from the ceiling, throwing downward">Ceiling</button>
        <button class="btn sm" id="iMount2" title="Ultra short throw, on a unit right under the screen">Short throw</button>
      </span>
    </div>
    <div class="insp-grid">
      <div class="field">
        <label for="iHp">Lens height</label>
        <div class="in"><input id="iHp" type="number" min="0" max="400" step="1"><span class="unit">cm</span></div>
      </div>
      <div class="field">
        <label for="iOff">Offset</label>
        <div class="in"><input id="iOff" type="number" min="-150" max="250" step="1"><span class="unit">%</span></div>
      </div>
    </div>
    <p class="proj-out" id="iProjOut"></p>
    <p class="proj-out" id="iProjVert"></p>
  </div>
  <!-- PROJECTION SCREEN. The format lives HERE and not on the projector: it is the screen that
       has a shape, the projector only fills it. Both fields feed the vertical cut read on the
       projector's own sheet. -->
  <div class="insp-proj" id="iScreenRow" hidden>
    <div class="insp-grid" style="grid-template-columns:1fr">
      <div class="field">
        <label for="iHs">Bottom edge</label>
        <div class="in"><input id="iHs" type="number" min="0" max="400" step="1"><span class="unit">cm</span></div>
      </div>
    </div>
    <div class="insp-leaf">
      <span class="lbl">Format</span>
      <span class="seg" role="group" aria-label="Image format">
        <button class="btn sm" id="iRatio169" data-ratio="169" title="16:9, the usual one">16:9</button>
        <button class="btn sm" id="iRatio1610" data-ratio="1610" title="16:10">16:10</button>
        <button class="btn sm" id="iRatio2351" data-ratio="2351" title="2.35:1, cinema scope">2.35:1</button>
      </span>
    </div>
  </div>
  <!-- No angle slider (decision 0013): the rotation handle on the selection is the one path for a
       free rotation, this row carries buttons only. -->
  <div class="rotrow">
    <button class="btn sm" id="iRot90" title="Rotate 90°">Rotate 90°</button>
    <button class="btn sm" id="iSwing" title="Opens inwards / outwards" hidden>Swing direction</button>
    <button class="btn sm" id="iHinge" title="Hinge on the left or on the right" hidden>Hinge side</button>
    <button class="btn sm" id="iSide" title="Put on the other face of the wall (R key)" hidden>Flip side</button>
  </div>
  <div class="insp-actions">
    <button class="btn sm" id="iDup" title="Duplicate (Ctrl+D)">Duplicate</button>
    <button class="btn sm" id="iLock">Lock</button>
    <button class="btn sm dgr" id="iDel">Delete</button>
  </div>
</div>
