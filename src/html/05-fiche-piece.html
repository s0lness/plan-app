<!-- THE ROOM'S OWN CARD (nothing else): name, flooring, area, close cross. What it looked like
     before a wall's fields moved in here; they now live in `#wallCard` below, its own sibling in
     the same `.side-panels` column, so a room and a wall never share one panel again (decision
     0010, amended 2026-09-02: "quand je sélectionne un mur ça m'affiche aussi le menu de la
     pièce, je devrais juste voir le menu du mur"). -->
<div class="roomcard" id="roomCard" hidden>
  <div class="rc-head">
    <span class="sw"></span>
    <!-- A TITLE, not a field: renaming happens on a double-click, the same one path as the
         label on the plan and the chip in the rail (`renommerCelluleEnLigne`, decision 0013). -->
    <span class="rc-title" id="rcName" title="Double-click to rename"></span>
    <!-- The card had no way to close: once opened, it stayed there. -->
    <button class="flow-x" id="rcClose" type="button" title="Close the card" aria-label="Close the card">×</button>
  </div>
  <div class="rc-lbl">Flooring</div>
  <div class="rc-floor" id="rcFloor">
    <button type="button" class="btn sm floor-opt" data-floor="parquet">Wood</button>
    <button type="button" class="btn sm floor-opt" data-floor="herringbone">Herringbone</button>
    <button type="button" class="btn sm floor-opt" data-floor="tile">Tile</button>
    <button type="button" class="btn sm floor-opt" data-floor="plain">Plain</button>
  </div>
  <div class="rc-area" id="rcArea"></div>
  <!-- HOW LIT THIS ROOM IS, right under its area and read the same way: a measured number and the
       target it is measured against. The target comes from the room's NAME unless one is typed
       here, in which case the typed one wins. -->
  <div class="rc-area rc-light" id="rcLight"></div>
  <div class="rc-row">
    <div class="field">
      <label for="rcLux">Light target</label>
      <div class="in"><input id="rcLux" type="number" min="0" max="2000" step="10" placeholder="-"><span class="unit">lx</span></div>
    </div>
  </div>
</div>
<!-- THE WALL'S OWN CARD: a title (Wall, or Facade for an outline wall) and its Length, nothing
     else. Split, Square up and Delete are drawn ON THE WALL again (`rendu/calque.ts`), not here:
     the owner asked to keep them there. `#rcWarn` (the outline self-crossing alert) lives here
     too: it only ever lights up while a facade or a contour corner is selected, so it has no room
     in the room's own card any more than Length does. -->
<div class="roomcard" id="wallCard" hidden>
  <div class="rc-head">
    <span class="sw"></span>
    <span class="rc-title" id="wcTitle">Wall</span>
  </div>
  <div class="rc-warn" id="rcWarn">The walls cross each other; the shape may draw oddly.</div>
  <!-- EXACT LENGTH. The dimension already reads out during the drag; here it gets TYPED IN. Only
       the FREE end stretches: the other one is a junction, and moving it would break the wall
       across from it. A wall held at BOTH ends has no end to give, so the field is disabled and
       the note below says why. -->
  <!-- SAME GRAMMAR AS THE INSPECTOR (`.field`: label above, `.in` inline with its unit). A
       homegrown class here received NONE of the `.field .in` rules, so "cm" wrapped onto its own
       line below the field. Reuse the structure, don't reinvent it. -->
  <div class="rc-row" id="rcLenRow">
    <div class="field">
      <label for="rcLen">Length</label>
      <div class="in"><input id="rcLen" type="number" min="10" max="3000" step="1"><span class="unit">cm</span></div>
    </div>
  </div>
  <p class="rc-note" id="rcLenNote" hidden>Both ends of this wall are junctions, so there is no end to stretch. Move one of them first.</p>
</div>
</div>
