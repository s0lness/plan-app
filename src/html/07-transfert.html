<div class="setup xfer" id="xfer" hidden role="dialog" aria-modal="true" aria-labelledby="xferTitle">
  <div class="setup-card xfer-card" role="document">
    <div class="setup-body">
      <div class="setup-head" style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
        <h2 id="xferTitle">Save the plan</h2>
        <button class="flow-x" id="xferClose" title="Close" aria-label="Close">×</button>
      </div>
      <textarea id="xferTa" class="xfer-ta" rows="10" spellcheck="false" autocomplete="off"></textarea>
      <p class="xfer-hint" id="xferHint"></p>
      <div class="setup-actions">
        <button class="btn" id="xferFile" hidden>Choose a file…</button>
        <button class="btn pri" id="xferCopy" hidden>Copy</button>
        <button class="btn pri" id="xferImport" hidden>Import</button>
      </div>
    </div>
  </div>
</div>
