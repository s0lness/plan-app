<!-- The PLANS selector. One plan per row: its name (editable IN PLACE, double-click or the
     pencil), its last write, and the button that opens it. `main` is the household's plan: it
     carries no delete cross, because a button able to erase the plan of the flat you live in
     has no place next to a selector. -->
<div class="setup plans" id="plansDlg" hidden role="dialog" aria-modal="true" aria-labelledby="plansTitle">
  <div class="setup-card plans-card" role="document">
    <div class="setup-body">
      <div class="setup-head" style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
        <h2 id="plansTitle">Plans</h2>
        <button class="flow-x" id="plansClose" title="Close" aria-label="Close">×</button>
      </div>
      <div class="plans-list" id="plansList"></div>
      <div class="plans-new">
        <span class="in"><input id="plansNewName" type="text" maxlength="60" placeholder="Name of the new plan…" autocomplete="off"></span>
        <button class="btn pri" id="plansCreate">Create</button>
      </div>
      <p class="plans-hint" id="plansHint"></p>
    </div>
  </div>
</div>
