<!-- Feedback: a free-text note, sent to whoever maintains the plan (batch "retour-utilisateur").
     Opened from the File menu's Feedback entry (html/01-coque-rail.html, #btnFeedback, decision
     0015), which is NEVER hidden by door or by SYNC_ON, unlike html/13-partage.html's Share
     dialog, this one is reached the same way from the household door, a guest link, AND the
     local-only sandbox. Reuses the `.setup`/`.setup-card` chrome the Share and name-step dialogs
     already use. -->
<div class="setup" id="retourDlg" hidden role="dialog" aria-modal="true" aria-labelledby="retourTitle">
  <div class="setup-card retour-card" role="document">
    <div class="setup-body">
      <div class="setup-head" style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
        <h2 id="retourTitle">Feedback</h2>
        <button class="flow-x" id="retourClose" type="button" title="Close" aria-label="Close">×</button>
      </div>
      <p class="retour-lede">Found a bug, or something that should work differently? This goes straight to the person who maintains the plan.</p>
      <textarea class="retour-text" id="retourText" maxlength="2000" placeholder="What happened…" autofocus></textarea>
      <div class="setup-field retour-contact">
        <span class="setup-lbl">How to reach you (optional)</span>
        <input id="retourContact" type="text" maxlength="200" placeholder="Email, or a name" autocomplete="off" spellcheck="false">
      </div>
      <div class="setup-actions">
        <button class="btn pri" id="retourSend" type="button">Send</button>
      </div>
      <p class="retour-hint" id="retourHint"></p>
    </div>
  </div>
</div>
